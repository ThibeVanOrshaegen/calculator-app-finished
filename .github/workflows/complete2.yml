name: Build Example test report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build calculator
        run: npm run build --if-present

      - name: Run unit tests
        id: tests
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/junit.xml
        run: npm test -- --ci --reporters=default --reporters=jest-junit

      - name: Upload unit test report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/junit.xml
          archive: false

      - name: Bundle calculator
        run: |
          zip -qry "$RUNNER_TEMP/calculator-app.zip" . \
            -x '.git/*' '.github/*' '.env' '.env.*' '*/.env' '*/.env.*' '.npmrc' '*/.npmrc'
      - name: Upload calculator ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/calculator-app.zip
          archive: false

      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
