name: Docker Example

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-save

      - name: Build calculator
        run: npm run build --if-present

      - name: Run unit tests
        id: tests
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-reports/junit.xml
        run: >-
          npm test -- --ci --reporters=default --reporters=jest-junit
          --coverage --coverageDirectory=test-reports/coverage --coverageReporters=lcov

      - name: Upload unit test report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          path: test-reports/junit.xml
          archive: false
          if-no-files-found: error

      - name: Publish test and coverage report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: mridang/action-test-reporter@v3.0.0
        with:
          name: Unit tests
          results-path: test-reports/junit.xml
          coverage-path: test-reports/coverage/lcov.info

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"
