name: Docker CI

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Bestaande Git-tag, bv. v1.0.0. Leeg laten voor latest.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: "${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ inputs.git_tag || 'latest' }}"

    steps:
      - name: Checkout calculator
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_tag && format('refs/tags/{0}', inputs.git_tag) || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm install --no-package-lock --no-save

      - name: Run unit tests and generate coverage
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-reports/junit.xml
        run: >-
          npm test -- --ci --reporters=default --reporters=jest-junit
          --coverage --coverageDirectory=test-reports/coverage --coverageReporters=lcov

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-reports/
          if-no-files-found: error

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: bash
        run: git archive HEAD | docker build -t "$IMAGE" -

      - name: Scan image for CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE }}
          write-comment: false
          exit-code: false

      - name: Push Docker image
        run: docker push "$IMAGE"
