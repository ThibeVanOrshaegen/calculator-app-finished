name: Build Example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-save

      - name: Build calculator
        run: npm run build --if-present

      - name: Bundle calculator
        run: |
          zip -qry "$RUNNER_TEMP/calculator-app.zip" . \
            -x '.git/*' '.github/*' '.env' '.env.*' '*/.env' '*/.env.*' '.npmrc' '*/.npmrc'

      - name: Upload calculator ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/calculator-app.zip
          archive: false
          if-no-files-found: error
